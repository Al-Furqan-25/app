<div class="hero">
  <img src="https://drive.google.com/thumbnail?id=1Xj3VzUaWTCeys9TFWxcbBfubT8oB_3-c&sz=s1000" alt="شعار الفرقان">
  <h1>مرحباً بكنّ في رحاب الفرقان</h1>
  <p>حيث تسمو الأرواح بالقرآن، وتشرق القلوب بنور الإيمان، ونجتمع على حب الله في بيوت الله.</p>

  <div class="buttons">
    <p-button label="عرض الملف التعريفي" styleClass="p-button-outlined btn-open" (onClick)="openPdfViewer()"></p-button>
    <p-button label="تسجيل الدخول" styleClass="btn-custom w-100" (onClick)="goToLogin()"></p-button>
  </div>
</div>

<div class="footer">
  جميع الحقوق محفوظة &copy; الفرقان 2025
</div>

<!-- Modal لعرض الـ PDF باستخدام PrimeNG أو HTML عادي -->
<div id="pdfModal" class="pdf-modal" [style.display]="isPdfOpen ? 'flex' : 'none'">
  <div class="modal-header">
    <div class="modal-title">{{ pdfTitle }}</div>
    <div class="header-actions">
      <a [href]="pdfDownloadUrl" class="action-btn" title="تحميل الملف" target="_blank">
        <i class="pi pi-download"></i>
      </a>
      <button class="action-btn" (click)="closePdfViewer()" title="إغلاق">
        <i class="pi pi-times"></i>
      </button>
    </div>
  </div>
  
  <div class="modal-body">
    <div *ngIf="isLoadingPdf" class="loader-container" style="display: block;">
      <div class="spinner"></div>
    </div>
    <!-- <iframe [src]="safePdfUrl" class="pdf-iframe"></iframe> -->
  </div>
</div>
